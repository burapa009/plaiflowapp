services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: plaiflow
      POSTGRES_USER: plaiflow
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plaiflow -d plaiflow"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
