name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version: "1.27.1", cache-dependency-path: api/go.sum }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/server ./cmd/worker

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 12.4.1, run_install: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "24", cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: |
          pnpm build
          ! grep -R --fixed-strings "$DASHBOARD_API_TOKEN" .next/static
        env: { API_BASE_URL: "https://api.staging.invalid", DASHBOARD_API_TOKEN: "ci-not-a-secret" }

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.14" }
      - run: PYTHONPATH=python/src python -m unittest discover -s python/tests
      - run: PYTHONPATH=python/src python -m compileall -q python/src
      - run: PYTHONPATH=python/src python -m plaiflow_export

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env: { POSTGRES_DB: plaiflow_test, POSTGRES_USER: plaiflow, POSTGRES_PASSWORD: test-only }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plaiflow -d plaiflow_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env: { TEST_DATABASE_URL: "postgres://plaiflow:test-only@localhost:5432/plaiflow_test?sslmode=disable" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version: "1.27.1" }
      - run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
      - run: migrate -path api/migrations -database "$TEST_DATABASE_URL" up
      - run: cd api && go test -p 1 ./internal/postgres ./internal/httpapi
      - run: cd api && OCR_TEST_ADMIN_URL="$TEST_DATABASE_URL" go test ./internal/postgres -run '^TestFirmGrantAssignmentAndImmediateRevoke$' -count=1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version: "1.27.1" }
      - run: go install github.com/zricethezav/gitleaks/v8@47218a628da59ef6b24197d15f4b0248ca87f4f0
      - run: gitleaks git --redact
